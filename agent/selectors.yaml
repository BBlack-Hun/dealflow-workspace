# 카카오톡 데스크톱 UI 셀렉터·단축키·타이밍 외부화 (TECH_SPEC §1.5, §5.2)
# 카톡 업데이트로 UI가 바뀌면 코드가 아닌 이 파일만 수정합니다.
# ⚠ 아래 값들은 Windows 실기 검증(ROADMAP 1.10) 전 초기 추정치입니다.

backend: "uia"                       # pywinauto 백엔드 (uia | win32)
main_window_title_re: "카카오톡.*"    # 메인 창 제목 정규식
main_window_title_kw: "카카오톡"      # 포그라운드 창 제목 대조용

search_hotkey: ["ctrl", "f"]          # 친구/채팅 검색 열기

# 각 단계 대기 시간(초) — 느린 PC에서는 늘리세요
#
# ⚠ 이 묶음은 **하나뿐이어야 한다.** 예전에 `timings:` 가 이 파일에 두 번 있어서
#   뒤엣것이 앞엣것을 통째로 덮었다(YAML 은 마지막 키만 남긴다). 그래서 위쪽
#   대기시간이 전부 죽고 코드의 기본값으로만 돌았다 — 값이 코드 기본값과 같아서
#   증상이 안 보였을 뿐이다. 늘리려고 고쳐도 안 먹었을 자리다.
timings:
  window_wait: 5.0          # 메인 창 존재/준비 대기
  after_search_hotkey: 0.4  # Ctrl+F 후
  after_query_paste: 0.8    # 방 이름 붙여넣기 후 검색 결과 대기
  after_open_room: 0.8      # Enter로 방 연 후
  chat_wait: 2.0            # 채팅창 핸들 대기
  before_message_paste: 0.2
  after_message_paste: 0.5  # 붙여넣기 안정 대기
  after_send: 0.4           # Enter 전송 후
  focus_retries: 5          # 포커스 확보 재시도 (카톡이 앞으로 안 나오면 키 입력 안 함)
  after_focus: 0.4
  # 파일 첨부 — 아래 file_send 참고
  after_file_paste: 1.0     # 파일 Ctrl+V 후
  confirm_wait: 5.0         # 확인 창이 뜨기를 기다리는 시간
  after_confirm_click: 1.0  # 전송 단추를 누른 뒤
  # 방 검색 — 아래 room_search 참고
  room_search_wait: 2.0     # 검색어가 든 줄이 나타나기를 기다리는 시간
  room_search_poll: 0.15    # 그 사이 다시 읽어 보는 간격
  open_top_wait: 1.5        # 맨 위 방을 연 뒤 새 채팅창이 뜨기를 기다리는 시간
  after_close_chat: 0.3     # 그 채팅창을 닫은 뒤

# TODO(win, 1.10): 채팅창 제목 라벨 경로를 실기에서 파악해 아래에 추가하고
# kakao_windows.py의 정확 일치 검증에 연결.
# chat_title_label: { control_type: "Text", ... }

# ══════════════════════════════════════════════════════════════════════════
#  방 검색 — 검색 결과 줄에서 **방 제목만 읽는다.** 방을 열지 않는다.
#
#  ⚠ 여기 컨트롤 경로도 **추측이다.** Windows 카톡의 검색 결과 목록을 UIA 로
#    들여다본 사람이 없다. mac 쪽에서 본 모양(검색 결과 표의 각 줄, 첫 글자가
#    방 제목)을 본떠 적었다.
#
#  틀려도 **지어내지 않는다.** 아래 컨트롤을 못 찾으면 후보 0건으로 답하고
#  넘어간다(`kakao_windows.discover_rooms`). 화면은 후보가 0건이어도 초안·직접
#  적기로 돌아간다. 그리고 돌려주는 제목은 **검색어의 첫 낱말이 든 줄만** 남기므로
#  (`filter_room_titles`), 엉뚱한 목록을 읽어도 남의 방이 후보로 서지 않는다.
#
#  확인 절차는 docs/WINDOWS_TEST.md 의 "I. 방 검색 실기 확인" 에 있다.
# ══════════════════════════════════════════════════════════════════════════
room_search:
  # 검색 결과 목록을 담은 컨트롤. **위에서부터 차례로** 찾아보고 줄이 든 것을 쓴다.
  list_control_types: ["List", "Tree", "DataGrid", "Table"]

  # 목록 컨트롤을 더 좁히려면 여기에 AutomationId 를 적는다. 비어 있으면 안 좁힌다.
  list_auto_id: ""

  # 목록 안의 **한 줄**.
  item_control_types: ["ListItem", "TreeItem", "DataItem"]

  # 줄에서 방 제목을 읽는 컨트롤. 줄의 **첫 글자 조각**이 제목이라고 본다
  # (mac 도 각 줄의 첫 static text 를 읽는다).
  #   ★ 실기에서 줄 이름(Name) 자체가 제목이면 이 값을 "" 로 비운다 —
  #     그러면 글자 조각을 찾지 않고 줄 이름을 그대로 쓴다.
  item_text_control_type: "Text"

  # 살펴볼 줄 수 상한. 검색이 안 먹어 전체 대화목록이 잡혀도 여기서 끊는다.
  # (mac 의 `MAX_SEARCH_ROWS` 와 같은 뜻)
  max_rows: 60

  # 검색어가 **실제로 검색칸에 들어갔는지** 되읽는 컨트롤.
  #   읽은 값이 검색어와 다르면 후보를 읽지 않는다(0건). 못 읽으면 넘어간다 —
  #   못 읽는 것까지 실패로 보면 멀쩡한 PC 에서 후보가 영영 0건이 된다
  #   (`_input_text` 와 같은 판단).
  #   ★ 실기에서 엉뚱한 칸을 집어 0건이 계속 나오면 이 값을 "" 로 비워 끈다.
  input_control_type: "Edit"

  paste_hotkey: ["ctrl", "v"]

  # ── 목록을 못 읽을 때: 맨 위 방을 열어 창 제목을 읽는다 (0.11.2) ──
  #   실기(0.11.1)에서 위 목록 경로로는 줄을 하나도 못 읽었다(모든 회사 0건).
  #   그래서 검색어를 넣은 채로 아래 키를 눌러 **맨 위 결과 방을 열고**, 새로 뜬
  #   채팅창의 제목(GetWindowText)을 읽은 뒤 바로 닫는다. 채팅창에는 아무것도
  #   입력하지 않는다. 제목에 회사명이 없으면 버린다.
  #   처음 못 읽은 때 agent_logs/kakao_uia_dump.txt, 처음 연 채팅창은
  #   agent_logs/kakao_uia_chat_dump.txt 에 UIA 구조가 남는다 — 위 경로를 고칠 근거.
  open_top_fallback: true
  #   ★ Enter 가 첫 줄을 안 열면 ["down", "enter"] 로 바꾼다.
  open_top_keys: ["enter"]

# ══════════════════════════════════════════════════════════════════════════
#  파일 첨부 — ⚠⚠ **여기 값은 전부 추측이다.** 실기에서 확인하고 고칠 것.
#
#  Windows 카톡에 파일을 붙여 넣었을 때 확인 창이 뜨는지, 뜬다면 제목이 무엇이고
#  단추 이름이 무엇인지, 파일명과 개수가 어디에 적히는지 — **아무도 못 봤다.**
#  mac 에서 본 모양(`파일 전송` 시트 · `1개 전송` 단추)을 본떠 적어 둔 것이다.
#
#  틀려도 위험하지 않다. 확인 창을 못 찾거나 어긋나면 발송기가 **취소하고 아무것도
#  보내지 않는다**(`kakao_windows.check_confirm_window`). 확인 전에는 잘못 보내는
#  대신 안 보내고 실패로 남는 쪽이 맞다.
#
#  확인 절차는 docs/WINDOWS_TEST.md 의 "H. 파일 첨부 실기 확인" 에 있다.
# ══════════════════════════════════════════════════════════════════════════
file_send:
  # ★ 실기에서 확인한 뒤에만 true 로 바꾼다. 이 값이 곧 `can_send_files` 다 —
  #   true 로 두면 서버가 파일이 실린 잡을 이 PC 로 내준다. 확인 전에 켜면
  #   그 회차의 자료 전달이 통째로 실패한다(자료가 막히면 문구도 안 나간다).
  #
  #   확인하는 그 한 창에서만 켜려면 코드를 고치지 말고 환경변수를 쓴다:
  #       set DEALFLOW_WIN_FILE_SEND=1
  verified: false

  # 확인 창 제목 (정규식, 부분 일치)
  confirm_title_re: "파일\\s*전송|전송\\s*확인"

  # 단추 이름 (정규식, 전체 일치). `&` 는 밑줄 표시라 비교 전에 떼어 낸다.
  cancel_button_re: "^(취소|아니오|Cancel)(\\(.\\))?$"
  send_button_re: "^((\\d+)\\s*개\\s*)?(전송|보내기|확인|Send|OK)(\\(.\\))?$"

  # 창의 글자나 단추에서 개수를 읽어 내는 본. (`1개 전송`, `파일 2개를 …`)
  # 어디서도 개수를 못 읽으면 관문이 막는다.
  count_re: "(\\d+)\\s*개"

  paste_hotkey: ["ctrl", "v"]
