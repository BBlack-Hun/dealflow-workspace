# 카카오톡 데스크톱 UI 셀렉터·단축키·타이밍 외부화 (TECH_SPEC §1.5, §5.2)
# 카톡 업데이트로 UI가 바뀌면 코드가 아닌 이 파일만 수정합니다.
# ⚠ 아래 값들은 Windows 실기 검증(ROADMAP 1.10) 전 초기 추정치입니다.

backend: "uia"                       # pywinauto 백엔드 (uia | win32)
main_window_title_re: "카카오톡.*"    # 메인 창 제목 정규식
main_window_title_kw: "카카오톡"      # 포그라운드 창 제목 대조용

search_hotkey: ["ctrl", "f"]          # 친구/채팅 검색 열기

# 각 단계 대기 시간(초) — 느린 PC에서는 늘리세요
#
# ⚠ 이 묶음은 **하나뿐이어야 한다.** 예전에 `timings:` 가 이 파일에 두 번 있어서
#   뒤엣것이 앞엣것을 통째로 덮었다(YAML 은 마지막 키만 남긴다). 그래서 위쪽
#   대기시간이 전부 죽고 코드의 기본값으로만 돌았다 — 값이 코드 기본값과 같아서
#   증상이 안 보였을 뿐이다. 늘리려고 고쳐도 안 먹었을 자리다.
timings:
  window_wait: 5.0          # 메인 창 존재/준비 대기
  after_search_hotkey: 0.4  # Ctrl+F 후
  after_query_paste: 1.5    # 방 이름 붙여넣기 후 검색 결과 대기 (0.11.11: 0.8 → 1.5 — 짧으면 결과가 서기 전 Enter 로 다른 방이 열린다)
  after_open_room: 0.8      # Enter로 방 연 후
  chat_wait: 2.0            # 채팅창 핸들 대기
  before_message_paste: 0.2
  after_message_paste: 0.5  # 붙여넣기 안정 대기
  after_send: 0.4           # Enter 전송 후
  focus_retries: 5          # 포커스 확보 재시도 (카톡이 앞으로 안 나오면 키 입력 안 함)
  after_focus: 0.4
  # 파일 첨부 — 아래 file_send 참고
  open_dialog_wait: 5.0     # 첨부 단추 뒤 열기 창이 뜨기를 · [열기] 뒤 그 창이 닫히기를 기다리는 시간
  confirm_wait: 5.0         # [열기] 뒤 `파일 전송` 카드가 뜨기를 기다리는 시간
  card_settle: 0.5          # 카드가 뜬 뒤 찍기 전 — 덜 그려진 카드를 찍지 않게 (0.11.13)
  ocr_timeout: 30.0         # 카드 글자 인식(PowerShell + 윈도우 OCR) 한 번의 상한 (0.11.13)
  after_confirm_click: 3.0  # [1개 전송]을 누른 뒤 카드가 닫히기를 기다리는 상한 (0.11.13: 1.0 → 3.0)
  # 방 검색 — 아래 room_search 참고
  room_search_wait: 2.0     # 검색어가 든 줄이 나타나기를 기다리는 시간
  room_search_poll: 0.15    # 그 사이 다시 읽어 보는 간격
  open_top_wait: 1.5        # 맨 위 방을 연 뒤 새 채팅창이 뜨기를 기다리는 시간
  after_close_chat: 0.3     # 그 채팅창을 닫은 뒤
  after_close_search: 0.3   # 메인 창 검색창을 Esc 로 닫은 뒤 — 메인 창이 숨었는지 보기 전에 (0.11.10)

# TODO(win, 1.10): 채팅창 제목 라벨 경로를 실기에서 파악해 아래에 추가하고
# kakao_windows.py의 정확 일치 검증에 연결.
# chat_title_label: { control_type: "Text", ... }

# ══════════════════════════════════════════════════════════════════════════
#  방 검색 — 검색 결과 줄에서 **방 제목만 읽는다.** 방을 열지 않는다.
#
#  ⚠ 여기 컨트롤 경로도 **추측이다.** Windows 카톡의 검색 결과 목록을 UIA 로
#    들여다본 사람이 없다. mac 쪽에서 본 모양(검색 결과 표의 각 줄, 첫 글자가
#    방 제목)을 본떠 적었다.
#
#  틀려도 **지어내지 않는다.** 아래 컨트롤을 못 찾으면 후보 0건으로 답하고
#  넘어간다(`kakao_windows.discover_rooms`). 화면은 후보가 0건이어도 초안·직접
#  적기로 돌아간다. 그리고 돌려주는 제목은 **검색어의 첫 낱말이 든 줄만** 남기므로
#  (`filter_room_titles`), 엉뚱한 목록을 읽어도 남의 방이 후보로 서지 않는다.
#
#  확인 절차는 docs/WINDOWS_TEST.md 의 "I. 방 검색 실기 확인" 에 있다.
# ══════════════════════════════════════════════════════════════════════════
room_search:
  # 검색 결과 목록을 담은 컨트롤. **위에서부터 차례로** 찾아보고 줄이 든 것을 쓴다.
  list_control_types: ["List", "Tree", "DataGrid", "Table"]

  # 목록 컨트롤을 더 좁히려면 여기에 AutomationId 를 적는다. 비어 있으면 안 좁힌다.
  list_auto_id: ""

  # 목록 안의 **한 줄**.
  item_control_types: ["ListItem", "TreeItem", "DataItem"]

  # 줄에서 방 제목을 읽는 컨트롤. 줄의 **첫 글자 조각**이 제목이라고 본다
  # (mac 도 각 줄의 첫 static text 를 읽는다).
  #   ★ 실기에서 줄 이름(Name) 자체가 제목이면 이 값을 "" 로 비운다 —
  #     그러면 글자 조각을 찾지 않고 줄 이름을 그대로 쓴다.
  item_text_control_type: "Text"

  # 살펴볼 줄 수 상한. 검색이 안 먹어 전체 대화목록이 잡혀도 여기서 끊는다.
  # (mac 의 `MAX_SEARCH_ROWS` 와 같은 뜻)
  max_rows: 60

  # 검색어가 **실제로 검색칸에 들어갔는지** 되읽는 컨트롤.
  #   읽은 값이 검색어와 다르면 후보를 읽지 않는다(0건). 못 읽으면 넘어간다 —
  #   못 읽는 것까지 실패로 보면 멀쩡한 PC 에서 후보가 영영 0건이 된다
  #   (`_input_text` 와 같은 판단).
  #   ★ 실기에서 엉뚱한 칸을 집어 0건이 계속 나오면 이 값을 "" 로 비워 끈다.
  input_control_type: "Edit"

  paste_hotkey: ["ctrl", "v"]

  # 검색창을 연 뒤 붙여넣기 **전에** 차례로 누르는 키 묶음들 (0.11.3, 0.11.4).
  #   카톡은 검색칸에 직전 검색어를 남겨 둔다 — 안 비우면 다음 회사명이 이어
  #   붙어 `가나다라마바` 로 검색됐다(실기). 끄려면 [] 로 둔다.
  #   먼저 UIA 로 검색칸(input_control_type)을 직접 비워 보고, 안 될 때만 누른다.
  #   ⚠⚠ Ctrl+A 는 **넣지 말 것.** 카톡 메인 창에서 Ctrl+A 는 '친구 추가' 다 —
  #      0.11.3 이 친구 추가 창을 띄우고 회사명을 거기에 붙였다(실기). 넣어도
  #      발송기가 경고를 남기고 건너뛴다.
  clear_keys: [["end"], ["shift", "home"], ["backspace"]]

  # ── 목록을 못 읽을 때: 맨 위 방을 열어 창 제목을 읽는다 (0.11.2) ──
  #   실기(0.11.1)에서 위 목록 경로로는 줄을 하나도 못 읽었다(모든 회사 0건).
  #   그래서 검색어를 넣은 채로 아래 키를 눌러 **맨 위 결과 방을 열고**, 새로 뜬
  #   채팅창의 제목(GetWindowText)을 읽은 뒤 바로 닫는다. 채팅창에는 아무것도
  #   입력하지 않는다. 제목에 회사명이 없으면 버린다.
  #   처음 못 읽은 때 agent_logs/kakao_uia_dump.txt, 처음 연 채팅창은
  #   agent_logs/kakao_uia_chat_dump.txt 에 UIA 구조가 남는다 — 위 경로를 고칠 근거.
  open_top_fallback: true
  #   ★ Enter 가 첫 줄을 안 열면 ["down", "enter"] 로 바꾼다.
  open_top_keys: ["enter"]

# ══════════════════════════════════════════════════════════════════════════
#  파일 첨부 — Windows 실기 화면(10/20)을 본떴다.
#
#  ⚠ 붙여넣기(Ctrl+V)로는 파일이 안 간다(실기). 사람이 하는 그대로 간다:
#    채팅창 아래 줄의 첨부 단추(풍선 도움말 `파일전송 Ctrl+T`) → Windows **열기** 창 →
#    `파일 이름(N):` 칸에 전체 경로 → [열기(O)] → 카톡 **`파일 전송`** 카드 → [1개 전송]
#  카드(실기): 제목 `파일 전송` · [×] · 파일 줄(`시험자료.pdf` · `149KB` · `⋮`) ·
#    넓은 [1개 전송] 하나 — [취소] 단추는 없다(닫기는 [×]).
#  `전송 불가` 카드(실기, 0바이트 파일): `전송 불가 1` · 파일명 · `비어있는 파일` · [확인].
#
#  ★ (0.11.13) 카드는 손으로 그린 창이라 **UIA 로는 글자도 단추도 안 보인다**(실기 0.11.12).
#    그래서 카드는 **창 구조**(아래 card_*)로 찾고, 글자는 카드 자리를 찍어 **윈도우 내장
#    글자 인식(OCR, 한국어)** 으로 읽는다. 누르는 자리는 OCR 이 읽은 `1개 전송` 글자의
#    한가운데다. 한국어 OCR 이 없으면 **안 보낸다**(설정 > 언어 > 한국어 > 언어 옵션).
#
#  틀려도 잘못 보내지 않는다. 열기 창 · 카드를 못 찾거나 못 읽거나 관문이 어긋나면 **닫고
#  아무것도 보내지 않는다**(`kakao_windows.check_file_card`). 열기 창 · 카드가 뜰 때와
#  실패할 때 카톡 창들과 그 속 컨트롤, 카드의 OCR 글자 · 자리를 떠 둔다 —
#  agent_logs/kakao_file_send_dump.txt · agent_logs/kakao_file_card.png · 진단 기록의 ui_dump
#  (실기 확인 전에는 성공해도 올린다). 거기 보이는 값으로 아래를 고친다.
#
#  확인 절차는 docs/WINDOWS_TEST.md 의 "H. 파일 첨부 실기 확인" 에 있다.
# ══════════════════════════════════════════════════════════════════════════
file_send:
  # ★ 실기에서 확인한 뒤에만 true 로 바꾼다. 이 값이 곧 `can_send_files` 다 —
  #   true 로 두면 서버가 파일이 실린 잡을 이 PC 로 내준다. 확인 전에 켜면
  #   그 회차의 자료 전달이 통째로 실패한다(자료가 막히면 문구도 안 나간다).
  #
  #   확인하는 그 한 창에서만 켜려면 코드를 고치지 말고 환경변수를 쓴다:
  #       set DEALFLOW_WIN_FILE_SEND=1
  verified: false

  # ① 첨부 단추 — 채팅창 속 Button 중 이름(또는 도움말)이 이 본에 걸리는 것 **하나**.
  #    UIA 로 못 찾으면 그 단추의 단축키를 누른다. 화면 좌표로는 누르지 않는다.
  attach_button_re: "파일\\s*전송"
  attach_hotkey: ["ctrl", "t"]

  # ② Windows 열기 창 — 카톡 프로세스의 새 창 · 이 제목 · 이 클래스 · 주인이 그 채팅창
  open_dialog_title_re: "^(열기|Open)$"
  open_dialog_class: "#32770"
  #    그 창의 컨트롤 AutomationId (Windows 공통 대화 상자 — 언어와 무관하다)
  file_name_edit_id: "1148"   # 파일 이름(N): 칸
  open_button_id: "1"         # [열기(O)]
  cancel_button_id: "2"       # [취소]

  # ③ 카톡 `파일 전송` 카드 — **창 구조로** 찾는다(0.11.12 실기에서 UIA 로 본 그대로).
  #    [열기] 뒤 새로 뜬 카톡 창 중 이 클래스 · 주인이 그 채팅창 · 제목이 이 본 · 속에 이
  #    클래스+id 의 창이 있는 것 **딱 하나**. 없거나 여럿이면 안 보낸다.
  card_class: "EVA_Window_Dblclk"
  card_title_re: "^(|파일\\s*전송)$"
  card_child_class: "EVA_ChildWindow"   # 파일 줄 자리
  card_child_id: "1001"
  #    카드 글자를 읽는 윈도우 OCR 인식기 언어 · 읽기 전에 그림을 키우는 배수(작은 화면
  #    글자는 키워야 잘 읽힌다 — 실기에서 글자를 못 읽으면 3 으로)
  ocr_language: "ko"
  ocr_upscale: 2
  #    카드의 [×] — 오른쪽 위 모서리에서 (왼쪽으로, 아래로) 화면 점. 배율 100% 기준이고
  #    창의 배율만큼 늘린다(실기 화면에서 쟀다). `⋮` 메뉴는 누르지 않는다.
  card_close_offset: [20, 19]

  # 아래 글자 본은 **OCR 이 읽은 줄**(띄어쓰기를 지운 것)에 건다.
  # 카드 속 글자 (정규식, 부분 일치)
  confirm_title_re: "파일\\s*전송"
  # 보내기 단추 (정규식, 전체 일치) — 개수가 박혀 나온다. 그 숫자가 보내려던 개수(늘 1)와
  # 같아야 누른다. ⚠ `확인` 은 넣지 않는다 — `전송 불가` 카드의 [확인]은 닫기다.
  send_button_re: "^\\s*(\\d+)\\s*개\\s*전송\\s*$"
  # `전송 불가` 카드를 닫는 단추 — 그 카드에서만 누른다.
  dismiss_button_re: "^(확인|OK)$"
  # 카톡이 파일을 받지 않았다는 글자. 보이면 [확인]으로 닫고 그 까닭을 실패로 남긴다
  # (문구도 안 나간다). 일부만 불가여도 불가다.
  unsendable_re: "전송\\s*불가"
