# main 에 머지되면 서버에 배포한다.
#
# 손으로 배포하던 때는 "머지했는데 서버는 옛날 것" 인 상태가 오래 갔다. 그동안
# 화면을 보고 이야기하는 사람과 코드를 보고 이야기하는 사람이 서로 다른 것을
# 보게 된다.
#
# **테스트가 통과한 뒤에만** 돈다(workflow_run). push 에 바로 걸면 테스트와
# 배포가 나란히 달려서, 깨진 코드가 먼저 서버에 닿을 수 있다.
#
# 하는 일은 ssh 한 번이 전부다. 실제 절차(백업 → 받기 → 다시 띄우기 →
# 헬스체크 → 실패하면 되돌리기)는 서버의 /home/dealflow/deploy.sh 가 갖는다.
# 배포 키가 authorized_keys 의 command= 로 그 스크립트에 묶여 있어, 여기서
# 무슨 명령을 보내든 그것만 실행된다 — 이 저장소는 공개라 키가 새는 경우를
# 가정해 두었다.
name: deploy

on:
  workflow_run:
    workflows: ["tests"]
    types: [completed]
    branches: [main]
  # 배포만 다시 돌리고 싶을 때(서버를 손으로 만진 뒤 되맞추기 등)
  workflow_dispatch:

# 두 개가 겹쳐 돌면 git reset 과 build 가 서로를 밟는다. 줄을 세우되
# 취소하지는 않는다 — 중간 커밋을 건너뛰면 무엇이 올라갔는지 알 수 없다.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # workflow_run 은 테스트가 **실패해도** 트리거된다. 결과를 봐야 한다.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 서버에 배포 요청
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          if [ -z "${KEY:-}" ] || [ -z "${HOST:-}" ]; then
            echo "배포 secret 이 없습니다. DEPLOY_SSH_KEY / DEPLOY_HOST /"
            echo "DEPLOY_USER / DEPLOY_KNOWN_HOSTS 를 저장소 secret 에 넣으세요."
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY"   > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # 호스트키를 미리 넣어 둔다. StrictHostKeyChecking=no 로 열어 두면
          # 중간에 낀 서버에 그대로 배포 명령을 보내게 된다.
          printf '%s\n' "$HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o ConnectTimeout=20 "$USER@$HOST"

      - name: 실제로 떴는지 밖에서 확인
        # 서버 안에서 도는 헬스체크는 Caddy·인증서·방화벽 문제를 못 잡는다.
        #
        # 주소는 서버 `deploy/.env` 의 `DEALFLOW_DOMAIN` 과 **같아야 한다.**
        # 여기서 읽어 올 방법이 없어 한 벌 더 적는다 — 도메인을 바꿀 때는
        # 두 곳을 같이 고쳐야 하고, 안 고치면 배포는 됐는데 이 단계만
        # 빨개진다(그때 무엇이 틀렸는지 이 주석이 알려 준다).
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 10 \
                   https://contactvc.duckdns.org/health || true)
            if [ "$code" = "200" ]; then echo "화면 정상 (200)"; exit 0; fi
            sleep 6
          done
          echo "밖에서 접속이 안 됩니다 (마지막 응답: ${code:-없음})"
          exit 1
