# dealflow Sprint 1 prototype — web app + mock sending agent.
# `docker compose up -d --build`  → open http://localhost:8889
#
# The mock agent runs INSIDE compose so a send list created in the browser is
# processed automatically end-to-end (success/failure shown on the progress screen).
# The real KakaoDesktopSender is Windows-native and is NOT containerized.

services:
  web:
    build: .
    image: dealflow:sprint1
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      # **시간대는 반드시 한국이다.** 기본값(UTC)이면 자정~오전 9시 사이에
      # 서버가 어제라고 생각한다 — 8/25 아침에 "다음 발송까지 2일" 이라고
      # 떠서 하루 어긋났다. 회차일·후속 예약일이 전부 이 날짜로 계산된다.
      TZ: "${TZ:-Asia/Seoul}"
      # 값이 있으면 모든 발송이 이 카톡방 하나로만 나간다(실투자사 오발송 방지).
      DEALFLOW_TEST_ROOM: "${DEALFLOW_TEST_ROOM:-}"
      # 카톡방 이름 끝에 붙는 고정 문구. 저장소 기본값은 가상 이름이라 .env 로 실제 값을 준다.
      DEALFLOW_ROOM_SUFFIX: "${DEALFLOW_ROOM_SUFFIX:-Deal 공유 우리브이씨 Asset}"
      # 데모 데이터(가상 담당자·기업)를 넣을지. 실운영에서는 0 으로 둔다.
      DEALFLOW_SEED_DEMO: "${DEALFLOW_SEED_DEMO:-0}"
      # 메일 발송 설정. 비어 있으면 발송 화면에서 이메일 채널을 고를 수 없다.
      DEALFLOW_SMTP_HOST: "${DEALFLOW_SMTP_HOST:-}"
      DEALFLOW_SMTP_PORT: "${DEALFLOW_SMTP_PORT:-587}"
      DEALFLOW_SMTP_USER: "${DEALFLOW_SMTP_USER:-}"
      DEALFLOW_SMTP_PASSWORD: "${DEALFLOW_SMTP_PASSWORD:-}"
      DEALFLOW_SMTP_FROM: "${DEALFLOW_SMTP_FROM:-}"
      DEALFLOW_SMTP_TLS: "${DEALFLOW_SMTP_TLS:-1}"
      DEALFLOW_SMTP_SSL: "${DEALFLOW_SMTP_SSL:-}"
      # 결과 문의 문자 알림(팀원에게만). 비어 있으면 알림 실이 아예 뜨지 않는다.
      DEALFLOW_SMS_API_KEY: "${DEALFLOW_SMS_API_KEY:-}"
      DEALFLOW_SMS_API_SECRET: "${DEALFLOW_SMS_API_SECRET:-}"
      DEALFLOW_SMS_FROM: "${DEALFLOW_SMS_FROM:-}"
      # 문자에 넣는 링크의 주소. 로컬에서는 비어 있어 알림이 켜지지 않는다.
      DEALFLOW_DOMAIN: "${DEALFLOW_DOMAIN:-}"
      RUN_MIGRATIONS: "1"                       # apply migrations + bootstrap on start
      DEALFLOW_AGENT_TOKEN: "agt_demo_token_sprint1"
      DATABASE_URL: "sqlite:////app/data/dealflow.db"
    ports:
      - "8889:8000"                             # host 8889 -> container 8000
    volumes:
      - dealflow_data:/app/data                 # persist SQLite across restarts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  # 데모용 가짜 발송기. 실제 카톡 발송을 테스트할 때 같은 토큰으로 잡을 가로채므로
  # 기본 기동에서 제외한다. 필요할 때만:  docker compose --profile demo up -d
  agent-mock:
    profiles: ["demo"]
    build: .
    image: dealflow:sprint1
    command: ["python", "-m", "agent.main", "--config", "agent/config.yaml"]
    environment:
      TZ: "${TZ:-Asia/Seoul}"                   # 발송 로그 시각도 한국 시간으로
      RUN_MIGRATIONS: "0"                       # agent never touches the DB
      DEALFLOW_SERVER_URL: "http://web:8000"
      DEALFLOW_AGENT_TOKEN: "agt_demo_token_sprint1"
      # mock = 가짜 발송(기본) · telegram = 본인 텔레그램으로 실제 수신 테스트
      DEALFLOW_SENDER: "${DEALFLOW_SENDER:-mock}"
      DEALFLOW_MOCK_FAIL_RATE: "0.15"           # occasional failures to show retry flow
      DEALFLOW_POLL_INTERVAL: "3"
      # 테스트 수신용(.env 에서 주입, 비어 있으면 telegram 센더는 쓰지 않음)
      DEALFLOW_TELEGRAM_TOKEN: "${DEALFLOW_TELEGRAM_TOKEN:-}"
      DEALFLOW_TELEGRAM_CHAT_ID: "${DEALFLOW_TELEGRAM_CHAT_ID:-}"
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  dealflow_data:
