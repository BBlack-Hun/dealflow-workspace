<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1280">
  <title>{% block title %}dealflow{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/app.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>📨</text></svg>">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">dealflow</div>
      <div class="brand-sub">딜소싱 워크스페이스</div>
      <nav class="menu">
        {% for m in menu %}
        <a class="menu-item {% if m.key == active %}active{% endif %}" href="{{ m.href }}">
          <span>{{ m.label }}</span>
          {% if m.badge %}<span class="menu-badge">{{ m.badge }}</span>{% endif %}
        </a>
        {% endfor %}
      </nav>
      <div class="sidebar-foot">
        <div id="agent-badge" class="agent-badge {% if agent.online %}on{% else %}off{% endif %}">
          <span class="dot"></span>
          <span id="agent-badge-label">{{ agent.label }}</span>
        </div>
      </div>
    </aside>
    <main class="content">
      {% if test_room %}
      <div class="test-banner">
        🧪 <b>테스트 모드</b> — 모든 발송이 실제 담당자가 아니라
        <code>{{ test_room }}</code> 방으로만 전송됩니다.
      </div>
      {% endif %}
      {% block content %}{% endblock %}
    </main>
  </div>
  <script src="/static/js/agent_badge.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
